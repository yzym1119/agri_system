spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:agri_system}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:agri}
    password: ${DB_PASSWORD:agri1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

mybatis-flex:
  type-aliases-package: com.agri_system.domain.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# 微信配置
wechat:
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}
  # 客户端微信订阅消息通知（默认关闭；门控：enabled=false 或某事件 template-id 留空时整条管道 no-op）
  # 运营在 mp.weixin.qq.com 申请模板并填入 template-id 后即激活，无需改后端。
  # 字段映射的语义键由 CustomerNotificationEventListener 提供：order-finished → orderId/orderNo/amount/time；recharge-success → customerId/amount
  subscribe-message:
    enabled: false
    miniprogram-state: formal
    templates:
      # order-finished:
      #   template-id:        # 在 mp.weixin.qq.com 申请模板后填入
      #   page: pages/order/detail?id={orderId}
      #   fields:
      #     thing1: orderNo
      #     amount2: amount
      #     date3: time
      # recharge-success:
      #   template-id:
      #   page: pages/wallet/index
      #   fields:
      #     character_string1: customerId
      #     amount2: amount

logging:
  level:
    root: INFO
    com.agri_system: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId}] %logger{36} - %msg%n"

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIYUN_OSS_AK:}
    access-key-secret: ${ALIYUN_OSS_SK:}
    bucket-name: ${ALIYUN_OSS_BUCKET:agriculture-store}

# 客户端自行确认外部支付：仅限本地联调。未接入真实支付网关前，prod/test 必须保持关闭（默认 false）
payment:
  client-confirm:
    enabled: true
