spring:
  application:
    name: api-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# 生产环境：禁用 Swagger
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false







































